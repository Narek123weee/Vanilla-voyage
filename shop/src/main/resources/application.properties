spring.application.name=shop

# MySQL connection (database is created automatically if it doesn't exist)
spring.datasource.url=jdbc:mysql://localhost:3306/shop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# !! Put your real MySQL root password here (leave empty only if root truly has no password)
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2 - replace with your actual Client ID from Google Cloud Console
google.client.id=YOUR_GOOGLE_CLIENT_ID
